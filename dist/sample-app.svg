<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#cdcfe6"/><g font-family="Arial,sans-serif" fill="#303147"><text x="70" y="90" font-size="22" font-weight="700">LITTLE ROUTINE</text><text x="865" y="90" font-size="13">MOBILE UI / SAMPLE</text><text x="70" y="210" font-size="60" font-weight="700" letter-spacing="-2">A little, every day.</text><text x="72" y="260" font-size="20">Small steps. A rhythm of your own.</text><rect x="230" y="325" width="330" height="580" rx="32" fill="#f8f8f1"/><rect x="640" y="325" width="330" height="580" rx="32" fill="#f8f8f1"/><text x="260" y="370" font-size="13">9:41</text><text x="670" y="370" font-size="13">9:41</text><text x="260" y="440" font-size="15" fill="#77798c">MONDAY, OCTOBER 5</text><text x="260" y="487" font-size="30" font-weight="700">Hello, you.</text><text x="260" y="525" font-size="15">What feels good today?</text><rect x="255" y="558" width="280" height="86" rx="15" fill="#dde4b3"/><text x="275" y="594" font-size="17" font-weight="700">Morning stretch</text><text x="275" y="623" font-size="13">5 minutes for yourself</text><rect x="255" y="660" width="280" height="86" rx="15" fill="#e2def2"/><text x="275" y="696" font-size="17" font-weight="700">Read a chapter</text><text x="275" y="725" font-size="13">A little room to think</text><rect x="255" y="790" width="280" height="55" rx="27" fill="#303147"/><text x="395" y="824" text-anchor="middle" font-size="15" fill="#fff">Add a routine</text><text x="670" y="444" font-size="28" font-weight="700">Your progress</text><text x="670" y="485" font-size="15">Every small step counts.</text><rect x="665" y="529" width="280" height="147" rx="16" fill="#dde4b3"/><text x="805" y="594" text-anchor="middle" font-size="42" font-weight="700">12</text><text x="805" y="634" text-anchor="middle" font-size="15">routines completed</text><text x="672" y="729" font-size="16" font-weight="700">This week</text><g fill="#797baf"><rect x="675" y="790" width="22" height="38" rx="5"/><rect x="713" y="772" width="22" height="56" rx="5"/><rect x="751" y="747" width="22" height="81" rx="5"/><rect x="789" y="764" width="22" height="64" rx="5"/><rect x="827" y="741" width="22" height="87" rx="5"/><rect x="865" y="758" width="22" height="70" rx="5"/><rect x="903" y="780" width="22" height="48" rx="5"/></g><text x="70" y="965" font-size="12" letter-spacing="2">SAMPLE DESIGN / REPLACE WITH YOUR OWN PROJECT</text></g></svg>
